<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-envelope"></i> Email Management System</h1>
            <p>Manage email addresses with activate and deactivate functionality</p>
        </header>

        <div class="main-content">
            <!-- Email Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="email" 
                        id="emailInput" 
                        placeholder="Enter email address..."
                        class="email-input"
                        required
                    >
                    <button id="addEmailBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Email
                    </button>
                </div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalEmails">0</span>
                        <span class="stat-label">Total Emails</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon active">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="activeEmails">0</span>
                        <span class="stat-label">Active</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon inactive">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="inactiveEmails">0</span>
                        <span class="stat-label">Inactive</span>
                    </div>
                </div>
            </div>

            <!-- Emails List Section -->
            <div class="emails-section">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> Email List</h2>
                    <button id="refreshBtn" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                
                <div class="filter-section">
                    <select id="statusFilter" class="filter-select">
                        <option value="all">All Emails</option>
                        <option value="active">Active Only</option>
                        <option value="inactive">Inactive Only</option>
                    </select>
                </div>

                <div id="emailsList" class="emails-list">
                    <div class="loading" id="loadingIndicator">
                        <i class="fas fa-spinner fa-spin"></i> Loading emails...
                    </div>
                </div>

                <div id="noEmailsMessage" class="no-emails" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <p>No emails found. Add your first email above!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
